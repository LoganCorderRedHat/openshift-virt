- name: Ensure required variables are defined for VM start
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - vm_namespace is defined
    fail_msg: >
      Missing required variables for VM start.
      Please provide: vm_name and vm_namespace.

- name: Start the VirtualMachine
  redhat.openshift_virtualization.kubevirt_vm:
    validate_certs: false
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    running: true
    wait: true
    wait_timeout: "{{ wait_timeout | default(600) }}"
