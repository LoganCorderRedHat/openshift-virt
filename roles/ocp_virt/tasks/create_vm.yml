- name: Ensure required variables are defined
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - vm_namespace is defined
      - source_name is defined
      - instance_type is defined
      - storage_class is defined
      - cloud_init_user_data is defined
    fail_msg: >
      One or more required variables are missing.
      Please provide: vm_name, vm_namespace, storage_class, source_name, instance_type, and cloud_init_user_data.

- name: Ensure secondary network definitions are valid
  ansible.builtin.assert:
    that:
      - item.nad_name is defined
      - (item.nad_name | string | length) > 0
    fail_msg: "Each item in vm_secondary_networks must define nad_name."
  loop: "{{ vm_secondary_networks | default(ocp_virt_vm_secondary_networks, true) | default([], true) }}"
  loop_control:
    label: "{{ item.nad_name | default('undefined') }}"

- name: Build base VM network/interface definitions
  ansible.builtin.set_fact:
    ocp_virt_vm_interfaces:
      - name: "{{ network_name | default('default') }}"
        masquerade: {}
    ocp_virt_vm_networks:
      - name: "{{ network_name | default('default') }}"
        pod: {}

- name: Add secondary NAD-backed network/interface definitions
  ansible.builtin.set_fact:
    ocp_virt_vm_interfaces: >-
      {{ ocp_virt_vm_interfaces
      + [ {'name': item.interface_name | default('nad' ~ idx), 'bridge': {}} ] }}
    ocp_virt_vm_networks: >-
      {{ ocp_virt_vm_networks
      + [ {'name': item.interface_name | default('nad' ~ idx),
      'multus': {'networkName': (item.nad_namespace | default(vm_namespace)) ~ '/' ~ item.nad_name }} ] }}
  loop: "{{ vm_secondary_networks | default(ocp_virt_vm_secondary_networks, true) | default([], true) }}"
  loop_control:
    index_var: idx

- name: Create a VirtualMachine by cloning the existing datavolume
  redhat.openshift_virtualization.kubevirt_vm:
    validate_certs: false
    state: present
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    labels:
      app: "{{ app_label | default(vm_name) }}"
    instancetype:
      name: "{{ instance_type }}"
    preference:
      name: "{{ preference | default('rhel.9') }}"
    data_volume_templates:
      - metadata:
          name: "{{ vm_name }}-datavolume"
        spec:
          sourceRef:
            kind: "{{ source_kind | default('DataSource') }}"
            name: "{{ source_name }}"
            namespace: "{{ source_namespace | default('openshift-virtualization-os-images') }}"
          storage:
            resources: {}
            storageClassName: "{{ storage_class }}"
    spec:
      domain:
        devices:
          interfaces: "{{ ocp_virt_vm_interfaces }}"
      networks: "{{ ocp_virt_vm_networks }}"
      volumes:
        - dataVolume:
            name: "{{ vm_name }}-datavolume"
          name: rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: "{{ cloud_init_user_data }}"
    wait: true
    wait_timeout: "{{ wait_timeout | default(3600) }}"

- name: Wait until the VirtualMachine is started
  redhat.openshift_virtualization.kubevirt_vm:
    name: "{{ vm_name }}"
    namespace: "{{ vm_namespace }}"
    running: true
  register: ocp_virt_vm_status
  until: ocp_virt_vm_status.result.status.printableStatus == "Running"
  retries: 60
  delay: 5
